<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tes Koneksi Supabase — IRA</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #1e293b; }
  h1 { font-size: 20px; }
  .card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; margin: 6px 0; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
  button { background: #2563eb; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  button:disabled { background: #94a3b8; }
  #status { padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 14px; }
  .ok { background: #dcfce7; color: #166534; }
  .err { background: #fee2e2; color: #991b1b; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #e2e8f0; }
  th { background: #f8fafc; }
</style>
</head>
<body>
<h1>Tes Koneksi Supabase — Dashboard IRA</h1>
<p style="font-size:13px;color:#64748b">Halaman tes: login lalu ambil data dari database. Bukti bahwa alur Auth + fetch bekerja.</p>

<div class="card" id="loginCard">
  <h3 style="margin-top:0">1. Login</h3>
  <input id="email" type="email" placeholder="Email (user yang tadi dibuat di Supabase)">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn" onclick="doLogin()">Login</button>
</div>

<div id="status"></div>

<div class="card" id="dataCard" style="display:none">
  <h3 style="margin-top:0">2. Data dari Database</h3>
  <button onclick="loadData()">Muat Data Cluster + Ringkasan</button>
  <div id="result"></div>
  <button onclick="doLogout()" style="background:#64748b;margin-top:12px">Logout</button>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://tfmioqfabqopjzopjdos.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2G7JJ634wKDyf22c7AiBxg_-_eixZMj';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
function setStatus(msg, ok) {
  $('status').textContent = msg;
  $('status').className = ok ? 'ok' : 'err';
}

window.doLogin = async function() {
  $('loginBtn').disabled = true;
  const email = $('email').value.trim();
  const password = $('password').value;
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  $('loginBtn').disabled = false;
  if (error) { setStatus('Login gagal: ' + error.message, false); return; }
  setStatus('Login berhasil! User: ' + data.user.email, true);
  $('loginCard').style.display = 'none';
  $('dataCard').style.display = 'block';
};

window.loadData = async function() {
  setStatus('Mengambil data...', true);
  // Ambil cluster + hitung customer per cluster
  const { data: clusters, error: e1 } = await supabase.from('cluster').select('*');
  if (e1) { setStatus('Gagal baca cluster: ' + e1.message, false); return; }

  // Hitung total customer & billing (head:true = cuma hitung, tidak tarik data)
  const { count: custCount } = await supabase.from('customer').select('*', { count: 'exact', head: true });
  const { count: billCount } = await supabase.from('billing').select('*', { count: 'exact', head: true });

  let html = '<table><tr><th>ID</th><th>Nama Cluster</th></tr>';
  clusters.forEach(c => { html += `<tr><td>${c.id}</td><td>${c.nama}</td></tr>`; });
  html += '</table>';
  html += `<p style="margin-top:12px"><b>Total customer:</b> ${custCount?.toLocaleString('id-ID')} &nbsp;|&nbsp; <b>Total billing:</b> ${billCount?.toLocaleString('id-ID')}</p>`;
  $('result').innerHTML = html;
  setStatus('Data berhasil diambil dari database!', true);
};

window.doLogout = async function() {
  await supabase.auth.signOut();
  $('dataCard').style.display = 'none';
  $('loginCard').style.display = 'block';
  $('result').innerHTML = '';
  setStatus('Sudah logout.', true);
};
</script>
</body>
</html>
